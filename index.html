<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>家庭庫存</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#f0f0f0;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.15);
  --accent:#2563eb;--green:#16a34a;--green-bg:#f0fdf4;
  --amber:#b45309;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --radius:10px;--radius-lg:14px;
  --tab-h:60px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px} /* 16px prevents iOS zoom */

/* App shell */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:52px}
.header-title{font-size:17px;font-weight:600;letter-spacing:-.02em}
.header-actions{display:flex;gap:8px}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px;padding-bottom:calc(var(--tab-h) + var(--safe-bottom) + 12px)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:0.5px solid var(--border);display:flex;height:calc(var(--tab-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--text3);font-size:10px;font-family:inherit;padding:8px 4px}
.nav-btn i{font-size:22px}
.nav-btn.active{color:var(--accent)}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;min-width:16px;text-align:center}
.nav-item-wrap{position:relative;flex:1;display:flex}
.nav-item-wrap .nav-btn{flex:1}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:10px}
.card-header{padding:12px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:500;color:var(--text2)}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:12px;color:var(--text3)}
.stat-value{font-size:26px;font-weight:600;letter-spacing:-.02em}
.stat-value.warn{color:var(--amber)}
.stat-value.danger{color:var(--red)}

/* Alert */
.alert{background:var(--amber-bg);border:0.5px solid #FAC775;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#633806}
.alert.hidden{display:none}
.alert i{font-size:18px;color:var(--amber);flex-shrink:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:14px;background:var(--surface);color:var(--text);font-family:inherit}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:7px;border-radius:8px}
.btn.danger-outline{color:var(--red);border-color:rgba(220,38,38,.3);background:transparent}
.btn i{font-size:16px}
.btn-block{width:100%;justify-content:center;padding:13px}

/* Filter */
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);font-size:13px;white-space:nowrap;background:var(--surface);color:var(--text2);font-family:inherit}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Item list */
.item-card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.item-info{flex:1;min-width:0}
.item-name{font-size:15px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.src-tag{background:var(--surface2);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--text2)}
.qty-control{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:32px;height:32px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);font-family:inherit}
.qty-btn:active{background:var(--border2)}
.qty-num{font-size:16px;font-weight:600;min-width:28px;text-align:center}
.qty-num.low{color:var(--amber)}
.qty-num.out{color:var(--red)}
.badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.low{background:var(--amber-bg);color:var(--amber)}
.badge.out{background:var(--red-bg);color:var(--red)}
.item-actions{display:flex;gap:6px;flex-shrink:0}

/* Shopping */
.src-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.src-scroll::-webkit-scrollbar{display:none}
.shop-item{background:var(--surface);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.shop-item .name{font-size:15px;font-weight:500;flex:1}
.shop-item .detail{font-size:12px;color:var(--text2);margin-top:2px}

/* Cost */
.cost-header-card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.cost-total-label{font-size:12px;color:var(--text3)}
.cost-total-val{font-size:24px;font-weight:600}
.cost-item{background:var(--surface);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.cost-item .date{font-size:12px;color:var(--text3);min-width:64px}
.cost-item .info{flex:1;min-width:0}
.cost-item .item-name2{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost-item .meta{font-size:12px;color:var(--text3);margin-top:1px}
.cost-item .amount{font-size:15px;font-weight:600;flex-shrink:0}
.month-header{font-size:13px;font-weight:500;color:var(--text2);padding:8px 0 6px;display:flex;justify-content:space-between}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-title{font-size:13px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);font-size:13px;background:var(--surface)}
.tag-del{background:none;border:none;color:var(--text3);font-size:16px;line-height:1;padding:0;display:flex;align-items:center}
.tag-del:active{color:var(--red)}
.add-row{display:flex;gap:8px;align-items:center}
.add-row input{flex:1;padding:10px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:15px}
input[type=color]{width:40px;height:40px;padding:3px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface);cursor:pointer}

/* Full-screen modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(20px + var(--safe-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 16px}
.modal-title{font-size:17px;font-weight:600;padding:0 16px 14px;border-bottom:0.5px solid var(--border)}
.modal-body{padding:16px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:11px 13px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:16px}
.form-row textarea{min-height:70px;resize:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.checkbox-label{display:flex;align-items:center;gap:7px;font-size:14px;padding:8px 12px;background:var(--surface2);border-radius:8px;cursor:pointer}
.checkbox-label input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.modal-footer{padding:12px 16px 0;display:flex;gap:10px}

.empty{text-align:center;padding:3rem 1rem;color:var(--text3)}
.empty i{font-size:36px;display:block;margin-bottom:10px}

/* Toast */
.toast{position:fixed;bottom:calc(var(--tab-h) + var(--safe-bottom) + 12px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}

/* Brand notes */
.brand-card{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.brand-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.brand-name{font-size:15px;font-weight:600}
.brand-stars{font-size:18px;letter-spacing:2px}
.brand-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text2);margin-bottom:8px}
.brand-pro{color:var(--green);font-size:12px;margin-top:4px}
.brand-con{color:var(--red);font-size:12px;margin-top:4px}
.brand-note-text{font-size:13px;color:var(--text2);margin-top:4px}
.pro-con-label{font-weight:600;margin-right:4px}

/* Restock */
.shop-item{position:relative}
.restock-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--border)}
.restock-input{width:64px;padding:6px 8px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);color:var(--text);font-size:15px;text-align:center}
.restock-btn{padding:7px 14px;border-radius:8px;background:var(--accent);color:#fff;border:none;font-size:13px;font-family:inherit;font-weight:500}
.restock-btn:active{opacity:.8}
.restock-done{background:var(--green)!important}
.shop-item-inner{display:flex;align-items:center;gap:10px}

/* Detail modal tabs */
.dt-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;margin:12px 16px 0}
.dt-tab{flex:1;padding:7px;border:none;background:transparent;border-radius:8px;font-size:13px;color:var(--text3);font-family:inherit;cursor:pointer}
.dt-tab.active{background:var(--surface);color:var(--text);font-weight:500}
/* Purchase history */
.purchase-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.purchase-row:last-child{border-bottom:none}
.purchase-date{font-size:12px;color:var(--text3);min-width:56px;flex-shrink:0}
.purchase-info{flex:1}
.purchase-name{font-size:13px;font-weight:500}
.purchase-meta{font-size:12px;color:var(--text3);margin-top:1px}
.purchase-amount{font-size:14px;font-weight:600;text-align:right;flex-shrink:0}
.purchase-unit{font-size:11px;color:var(--text3)}
/* Item picker */
.item-picker-overlay{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.15);max-height:220px;overflow-y:auto;z-index:300}
.item-picker-overlay.open{display:block}
.item-picker-opt{padding:11px 14px;font-size:14px;border-bottom:0.5px solid var(--border);cursor:pointer}
.item-picker-opt:last-child{border-bottom:none}
.item-picker-opt:active{background:var(--surface2)}
.b-item-wrap{position:relative}
</style>
</head>
<body>
<div class="app">
  <div class="header" id="mainHeader">
    <span class="header-title" id="headerTitle">庫存</span>
    <div class="header-actions" id="headerActions"></div>
  </div>
  <div class="content" id="mainContent"></div>
  <nav class="bottom-nav">
    <div class="nav-item-wrap">
      <button class="nav-btn active" id="navInv" onclick="showPage('inv')"><i class="ti ti-package"></i><span>庫存</span></button>
      <span class="nav-badge" id="navBadge" style="display:none"></span>
    </div>
    <button class="nav-btn" id="navShop" onclick="showPage('shop')"><i class="ti ti-shopping-cart"></i><span>購物清單</span></button>
    <button class="nav-btn" id="navCost" onclick="showPage('cost')"><i class="ti ti-receipt"></i><span>成本</span></button>
    <button class="nav-btn" id="navSettings" onclick="showPage('settings')"><i class="ti ti-settings"></i><span>設定</span></button>
  </nav>
</div>

<!-- Item Modal -->
<div class="modal-overlay" id="itemModal" onclick="if(event.target===this)closeModal('itemModal')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="itemModalTitle">新增物品</div>
    <div class="modal-body">
      <div class="form-row"><label>物品名稱</label><input type="text" id="f-name" placeholder="e.g. 洗髮精"></div>
      <div class="form-grid">
        <div class="form-row"><label>分類</label><select id="f-cat"></select></div>
        <div class="form-row"><label>單位</label><input type="text" id="f-unit" placeholder="瓶、包、罐"></div>
        <div class="form-row"><label>目前庫存</label><input type="number" id="f-qty" min="0" inputmode="numeric"></div>
        <div class="form-row"><label>補貨門檻</label><input type="number" id="f-min" min="0" inputmode="numeric"></div>
      </div>
      <div class="form-row"><label>建議補貨量（選填）</label><input type="number" id="f-reorder" min="0" inputmode="numeric" placeholder="每次買幾個"></div>
      <div class="form-row"><label>採購來源（可複選）</label><div class="checkbox-group" id="f-src-group"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal('itemModal')">取消</button>
      <button class="btn primary" style="flex:2;justify-content:center" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<!-- Buy Modal -->
<div class="modal-overlay" id="buyModal" onclick="if(event.target===this)closeModal('buyModal')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">記錄採購金額</div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row"><label>採購日期</label><input type="date" id="b-date"></div>
        <div class="form-row"><label>採購來源</label><select id="b-src"></select></div>
      </div>
      <div class="form-row">
        <label>物品名稱</label>
        <div class="b-item-wrap">
          <div style="display:flex;gap:6px">
            <input type="text" id="b-item" placeholder="e.g. 洗髮精" style="flex:1" oninput="filterItemPicker(this.value)" onfocus="showItemPicker()" onblur="setTimeout(()=>hideItemPicker(),200)">
            <button type="button" class="btn sm" onclick="toggleItemPicker()" style="flex-shrink:0;padding:0 10px"><i class="ti ti-list" style="font-size:18px"></i></button>
          </div>
          <div class="item-picker-overlay" id="itemPickerList"></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>數量</label><input type="number" id="b-qty" min="1" inputmode="numeric" value="1"></div>
        <div class="form-row"><label>金額（NT$）</label><input type="number" id="b-amount" min="0" inputmode="numeric"></div>
      </div>
      <div class="form-row"><label>備註（選填）</label><input type="text" id="b-note" placeholder="e.g. 特價、買二送一"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal('buyModal')">取消</button>
      <button class="btn primary" style="flex:2;justify-content:center" onclick="saveBuy()">儲存並更新庫存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzWK76cZTIKEoJGoc9bqi0M4sGLIMsUaE",
  authDomain: "good-e9e4e.firebaseapp.com",
  databaseURL: "https://good-e9e4e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "good-e9e4e",
  storageBucket: "good-e9e4e.firebasestorage.app",
  messagingSenderId: "878748843198",
  appId: "1:878748843198:web:6183a33453463ef8e2b2ef"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dataRef = ref(db, 'inventory');

// ── helpers ──────────────────────────────────────────────────────────────
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(x=>x!=null);
  if(typeof v==='object') return Object.values(v).filter(x=>x!=null);
  return [];
}
function sanitize(d){
  d.cats    = toArr(d.cats);
  d.sources = toArr(d.sources);
  d.costs   = toArr(d.costs);
  d.items   = toArr(d.items).map(item=>({
    ...item,
    sources: toArr(item.sources),
    brands:  toArr(item.brands),
  }));
  return d;
}
const DEFAULT = {
  cats:[
    {name:'日用品',color:'#2563eb'},{name:'飲料',color:'#16a34a'},{name:'零食',color:'#ea580c'},
    {name:'貓砂飼料',color:'#7c3aed'},{name:'清潔用品',color:'#db2777'},{name:'藥品保健',color:'#b45309'},{name:'其他',color:'#6b7280'}
  ],
  sources:['蝦皮','家樂福','五金行','藥妝店','超商'],
  items:[
    {id:1,name:'洗髮精',cat:'日用品',qty:1,min:2,unit:'瓶',reorder:3,sources:['蝦皮'],brands:[]},
    {id:2,name:'沐浴乳',cat:'日用品',qty:3,min:2,unit:'瓶',reorder:2,sources:['蝦皮','家樂福'],brands:[]},
    {id:3,name:'衛生紙',cat:'日用品',qty:2,min:3,unit:'包',reorder:5,sources:['家樂福'],brands:[]},
    {id:4,name:'可樂',cat:'飲料',qty:6,min:4,unit:'罐',reorder:12,sources:['家樂福','超商'],brands:[]},
    {id:5,name:'礦泉水',cat:'飲料',qty:1,min:6,unit:'瓶',reorder:12,sources:['家樂福'],brands:[]},
    {id:6,name:'洋芋片',cat:'零食',qty:0,min:2,unit:'包',reorder:4,sources:['超商','蝦皮'],brands:[]},
    {id:7,name:'貓飼料',cat:'貓砂飼料',qty:2,min:3,unit:'包',reorder:4,sources:['蝦皮'],brands:[]},
    {id:8,name:'貓砂',cat:'貓砂飼料',qty:4,min:2,unit:'包',reorder:3,sources:['蝦皮','五金行'],brands:[]},
    {id:9,name:'洗碗精',cat:'清潔用品',qty:2,min:1,unit:'瓶',reorder:2,sources:['家樂福'],brands:[]},
  ],
  costs:[],
};
// init from localStorage immediately (no blank screen)
let DATA;
try { DATA = sanitize(JSON.parse(localStorage.getItem('hiv3')||'null') || JSON.parse(JSON.stringify(DEFAULT))); }
catch(e){ DATA = JSON.parse(JSON.stringify(DEFAULT)); }
let nextItemId=10,nextCostId=3,editItemId=null,activeSrc='all',activeCatFilter='all',activeStatusFilter='all';
let currentPage='inv';

function save(){
  localStorage.setItem('hiv3',JSON.stringify(DATA));
  set(dataRef, DATA).catch(e=>console.error('Firebase save error',e));
}
function catColor(n){return(DATA.cats.find(c=>c.name===n)||{color:'#6b7280'}).color}
function itemStatus(item){if(item.qty===0)return'out';if(item.qty<=item.min)return'low';return'ok'}
function statusLabel(s){return{ok:'正常',low:'即將不足',out:'已用完'}[s]}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
function closeModal(id){document.getElementById(id).classList.remove('open')}

function showPage(p){
  currentPage=p;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav'+p.charAt(0).toUpperCase()+p.slice(1)).classList.add('active');
  const titles={inv:'庫存',shop:'購物清單',cost:'成本記錄',settings:'設定'};
  document.getElementById('headerTitle').textContent=titles[p];
  const c=document.getElementById('mainContent');
  const ha=document.getElementById('headerActions');
  if(p==='inv'){
    ha.innerHTML=`<button class="btn primary sm" onclick="openItemModal()"><i class="ti ti-plus"></i> 新增</button>`;
    renderInv(c);
  } else if(p==='shop'){
    ha.innerHTML=`<button class="btn sm" onclick="exportShopping()"><i class="ti ti-download"></i></button><button class="btn primary sm" onclick="openBuyModal()"><i class="ti ti-cash"></i> 記帳</button>`;
    renderShop(c);
  } else if(p==='cost'){
    ha.innerHTML=`<button class="btn sm" onclick="exportCost()"><i class="ti ti-download"></i></button>`;
    renderCost(c);
  } else if(p==='settings'){
    ha.innerHTML='';
    renderSettings(c);
  }
}

// ---- Inventory ----
function renderInv(c){
  if(!c)c=document.getElementById('mainContent');
  const low=DATA.items.filter(i=>itemStatus(i)==='low').length;
  const out=DATA.items.filter(i=>itemStatus(i)==='out').length;
  const ok=DATA.items.filter(i=>itemStatus(i)==='ok').length;
  const need=low+out;
  // badge
  const badge=document.getElementById('navBadge');
  if(need>0){badge.style.display='block';badge.textContent=need}else{badge.style.display='none'}

  // filter
  const cats=['all',...new Set(DATA.items.map(i=>i.cat))];
  const statusOpts=[{v:'all',l:'全部'},{v:'ok',l:'正常'},{v:'low',l:'即將不足'},{v:'out',l:'已用完'}];
  const filtered=DATA.items.filter(i=>{
    if(activeCatFilter!=='all'&&i.cat!==activeCatFilter)return false;
    if(activeStatusFilter!=='all'&&itemStatus(i)!==activeStatusFilter)return false;
    return true;
  });

  c.innerHTML=`
    ${need>0?`<div class="alert"><i class="ti ti-alert-triangle"></i><span>有 ${need} 項需要補貨（${out} 已用完、${low} 即將不足）</span></div>`:''}
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">總品項</div><div class="stat-value">${DATA.items.length}</div></div>
      <div class="stat-card"><div class="stat-label">需補貨</div><div class="stat-value ${need>0?'danger':''}">${need}</div></div>
    </div>
    <div class="filter-row" id="catFilterRow">
      ${cats.map(c=>`<button class="filter-chip ${activeCatFilter===c?'active':''}" onclick="setCatFilter('${c}')">${c==='all'?'全部':c}</button>`).join('')}
    </div>
    <div class="filter-row">
      ${statusOpts.map(o=>`<button class="filter-chip ${activeStatusFilter===o.v?'active':''}" onclick="setStatusFilter('${o.v}')">${o.l}</button>`).join('')}
    </div>
    ${filtered.length===0?`<div class="empty"><i class="ti ti-box-off"></i>沒有符合條件的物品</div>`:''}
    ${filtered.map(item=>{
      const s=itemStatus(item);
      const qc=s==='out'?'out':s==='low'?'low':'';
      const srcs=(item.sources||[]).map(s=>`<span class="src-tag">${s}</span>`).join(' ');
      const bc=(item.brands||[]).length;
      return`<div class="item-card">
        <div class="item-info" onclick="openDetail(${item.id})" style="cursor:pointer">
          <div class="item-name">${item.name}${bc?`<span style="font-size:11px;color:var(--accent);margin-left:6px;font-weight:400">${bc}個品牌</span>`:''}</div>
          <div class="item-meta">
            <span class="cat-dot" style="background:${catColor(item.cat)}"></span>
            <span>${item.cat}</span>
            ${srcs?`<span>·</span>${srcs}`:''}
          </div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="chQty(${item.id},-1)">−</button>
          <div>
            <div class="qty-num ${qc}" style="text-align:center">${item.qty}</div>
            <div style="font-size:10px;color:var(--text3);text-align:center">${item.unit}</div>
          </div>
          <button class="qty-btn" onclick="chQty(${item.id},1)">＋</button>
        </div>
        <button class="btn icon" onclick="openItemModal(${item.id})" style="align-self:flex-start;margin-top:-2px"><i class="ti ti-dots-vertical" style="font-size:18px"></i></button>
      </div>`;
    }).join('')}`;
}

function setCatFilter(v){activeCatFilter=v;renderInv()}
function setStatusFilter(v){activeStatusFilter=v;renderInv()}
function chQty(id,d){const i=DATA.items.find(x=>x.id===id);if(!i)return;i.qty=Math.max(0,i.qty+d);save();renderInv()}

function openItemModal(id){
  editItemId=id||null;
  document.getElementById('f-cat').innerHTML=DATA.cats.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  document.getElementById('f-src-group').innerHTML=DATA.sources.map(s=>`<label class="checkbox-label"><input type="checkbox" value="${s}"> ${s}</label>`).join('');
  if(id){
    const item=DATA.items.find(x=>x.id===id);
    document.getElementById('itemModalTitle').textContent='編輯物品';
    document.getElementById('f-name').value=item.name;
    document.getElementById('f-cat').value=item.cat;
    document.getElementById('f-unit').value=item.unit||'';
    document.getElementById('f-qty').value=item.qty;
    document.getElementById('f-min').value=item.min;
    document.getElementById('f-reorder').value=item.reorder||'';
    document.querySelectorAll('#f-src-group input').forEach(cb=>{if((item.sources||[]).includes(cb.value))cb.checked=true});
  } else {
    document.getElementById('itemModalTitle').textContent='新增物品';
    ['f-name','f-unit','f-reorder'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-qty').value='0';
    document.getElementById('f-min').value='2';
  }
  document.getElementById('itemModal').classList.add('open');
}

function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('請填物品名稱');return}
  const srcs=[...document.querySelectorAll('#f-src-group input:checked')].map(c=>c.value);
  const obj={
    id:editItemId||nextItemId++,name,
    cat:document.getElementById('f-cat').value,
    unit:document.getElementById('f-unit').value.trim()||'個',
    qty:parseInt(document.getElementById('f-qty').value)||0,
    min:parseInt(document.getElementById('f-min').value)||1,
    reorder:parseInt(document.getElementById('f-reorder').value)||null,
    sources:srcs
  };
  if(editItemId)DATA.items=DATA.items.map(i=>i.id===editItemId?obj:i);
  else DATA.items.push(obj);
  save();closeModal('itemModal');renderInv();showToast(editItemId?'已更新':'已新增');
}

// ---- Shopping ----
function renderShop(c){
  if(!c)c=document.getElementById('mainContent');
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  const allSrcs=['all',...new Set(need.flatMap(i=>i.sources||[]))];
  const shown=activeSrc==='all'?need:need.filter(i=>(i.sources||[]).includes(activeSrc));
  const byCat={};
  shown.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i)});
  c.innerHTML=`
    <div class="src-scroll">
      ${allSrcs.map(s=>`<button class="filter-chip ${s===activeSrc?'active':''}" onclick="setSrc('${s}')">${s==='all'?'全部來源':s}</button>`).join('')}
    </div>
    ${shown.length===0
      ?`<div class="empty"><i class="ti ti-circle-check" style="color:var(--green)"></i>此來源無需採購物品</div>`
      :Object.entries(byCat).map(([cat,list])=>`
        <div style="font-size:12px;font-weight:500;color:var(--text3);margin:14px 0 6px;display:flex;align-items:center;gap:5px">
          <span class="cat-dot" style="background:${catColor(cat)}"></span>${cat}
        </div>
        ${list.map(item=>{
          const s=itemStatus(item);
          const suggest=item.reorder?item.reorder:item.min+1;
          const suggestTxt=item.reorder?`建議補 ${item.reorder} ${item.unit}`:`補至 ${item.min+1} ${item.unit}以上`;
          return`<div class="shop-item" id="shop-${item.id}">
            <div class="shop-item-inner">
              <div style="flex:1">
                <div class="name">${item.name}</div>
                <div class="detail">目前 ${item.qty} ${item.unit}・${suggestTxt}</div>
              </div>
              <span class="badge ${s}">${statusLabel(s)}</span>
            </div>
            <div class="restock-row">
              <input class="restock-input" type="number" id="ri-${item.id}" value="${suggest}" min="1" inputmode="numeric" placeholder="數量">
              <span style="font-size:13px;color:var(--text3);flex-shrink:0">${item.unit}</span>
              <span style="font-size:13px;color:var(--text3);flex-shrink:0">NT$</span>
              <input class="restock-input" type="number" id="ra-${item.id}" min="0" inputmode="numeric" placeholder="金額" style="width:72px">
              <button class="restock-btn" id="rb-${item.id}" onclick="doRestock(${item.id})">✓ 已買到</button>
            </div>
          </div>`;
        }).join('')}`).join('')}
    ${shown.length>0?`<div style="margin-top:16px"><button class="btn" style="width:100%;justify-content:center" onclick="restockAll()"><i class="ti ti-checks"></i> 全部已買到</button></div>`:''}
  `;
}
function setSrc(s){activeSrc=s;renderShop()}

function doRestock(id){
  const item=DATA.items.find(i=>i.id===id);
  if(!item)return;
  const qty=parseInt(document.getElementById('ri-'+id).value)||0;
  if(qty<=0){showToast('請輸入補貨數量');return}
  const amount=parseInt(document.getElementById('ra-'+id).value)||0;
  // update stock
  item.qty+=qty;
  // auto log cost if amount filled
  if(amount>0){
    if(!Array.isArray(DATA.costs))DATA.costs=[];
    DATA.costs.unshift({
      id:nextCostId++,
      date:new Date().toISOString().slice(0,10),
      src:activeSrc==='all'?(item.sources&&item.sources[0]||''):activeSrc,
      item:item.name,qty,amount,note:'購物清單補貨'
    });
  }
  save();
  // mark done visually
  const btn=document.getElementById('rb-'+id);
  const card=document.getElementById('shop-'+id);
  if(btn){btn.textContent='✓ 已補貨';btn.classList.add('restock-done');btn.disabled=true}
  if(card){
    const detail=card.querySelector('.detail');
    if(detail)detail.textContent=`目前 ${item.qty} ${item.unit}`;
    const badge=card.querySelector('.badge');
    const s=itemStatus(item);
    if(badge){badge.className='badge '+s;badge.textContent=statusLabel(s)}
  }
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok').length;
  const badge=document.getElementById('navBadge');
  if(need>0){badge.style.display='block';badge.textContent=need}else{badge.style.display='none'}
  const msg=amount>0?`${item.name} 補 ${qty} ${item.unit}，NT$${amount}，已記帳`:`${item.name} 補 ${qty} ${item.unit}，庫存更新`;
  showToast(msg);
}

function restockAll(){
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  const shown=activeSrc==='all'?need:need.filter(i=>(i.sources||[]).includes(activeSrc));
  let count=0;
  if(!Array.isArray(DATA.costs))DATA.costs=[];
  shown.forEach(item=>{
    const qInput=document.getElementById('ri-'+item.id);
    const aInput=document.getElementById('ra-'+item.id);
    if(!qInput)return;
    const qty=parseInt(qInput.value)||0;
    const amount=aInput?parseInt(aInput.value)||0:0;
    if(qty>0){
      item.qty+=qty;
      if(amount>0){
        DATA.costs.unshift({
          id:nextCostId++,
          date:new Date().toISOString().slice(0,10),
          src:activeSrc==='all'?(item.sources&&item.sources[0]||''):activeSrc,
          item:item.name,qty,amount,note:'購物清單補貨'
        });
      }
      count++;
    }
  });
  if(!count){showToast('請先輸入補貨數量');return}
  save();renderShop();renderInv();
  showToast(`已更新 ${count} 項庫存`);
}

function exportShopping(){
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  if(!need.length){showToast('目前沒有需要採購的物品');return}
  const today=new Date().toLocaleDateString('zh-TW');
  const srcs=activeSrc==='all'?[...new Set(need.flatMap(i=>i.sources||[]))]:[activeSrc];
  let txt=`購物清單 ${today}\n${'─'.repeat(26)}\n`;
  srcs.forEach(src=>{
    const list=need.filter(i=>(i.sources||[]).includes(src));
    if(!list.length)return;
    txt+=`\n【${src}】\n`;
    list.forEach(i=>{
      const suggest=i.reorder?`補 ${i.reorder} ${i.unit}`:`補至 ${i.min+1} ${i.unit}以上`;
      txt+=`  ☐ ${i.name} — ${suggest}\n`;
    });
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
  a.download=`購物清單_${today}.txt`;a.click();
  showToast('已匯出');
}

function openBuyModal(){
  document.getElementById('b-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('b-src').innerHTML=DATA.sources.map(s=>`<option>${s}</option>`).join('');
  ['b-item','b-note'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('b-qty').value='1';
  document.getElementById('b-amount').value='';
  document.getElementById('buyModal').classList.add('open');
}
function saveBuy(){
  const item=document.getElementById('b-item').value.trim();
  const amount=parseInt(document.getElementById('b-amount').value)||0;
  if(!item){alert('請填物品名稱');return}
  const obj={
    id:nextCostId++,
    date:document.getElementById('b-date').value,
    src:document.getElementById('b-src').value,
    item,qty:parseInt(document.getElementById('b-qty').value)||1,
    amount,note:document.getElementById('b-note').value.trim()
  };
  if(!Array.isArray(DATA.costs))DATA.costs=[];
  DATA.costs.unshift(obj);
  const matched=DATA.items.find(i=>i.name===item);
  if(matched){
    matched.qty+=obj.qty;
    showToast('已記錄並更新庫存');
  } else {
    // 自動新增品項
    const defaultCat=DATA.cats.length?DATA.cats[0].name:'其他';
    const newItem={
      id:nextItemId++,name:item,
      cat:defaultCat,unit:'個',
      qty:obj.qty,min:1,reorder:null,
      sources:obj.src?[obj.src]:[],brands:[]
    };
    DATA.items.push(newItem);
    showToast(`已記錄並新增品項「${item}」`);
  }
  save();closeModal('buyModal');
  if(currentPage==='cost')renderCost();
  if(currentPage==='inv')renderInv();
  if(currentPage==='shop')renderShop();
}

function renderCost(c){
  if(!c)c=document.getElementById('mainContent');
  const filtered=toArr(DATA.costs);
  const total=filtered.reduce((a,b)=>a+b.amount,0);
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTotal=filtered.filter(c=>c.date.startsWith(thisMonth)).reduce((a,b)=>a+b.amount,0);
  const byMonth={};
  filtered.forEach(co=>{const m=co.date.slice(0,7);if(!byMonth[m])byMonth[m]=[];byMonth[m].push(co)});
  c.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">本月支出</div><div class="stat-value" style="font-size:20px">NT$ ${monthTotal.toLocaleString()}</div></div>
      <div class="stat-card"><div class="stat-label">累計支出</div><div class="stat-value" style="font-size:20px">NT$ ${total.toLocaleString()}</div></div>
    </div>
    ${filtered.length===0?`<div class="empty"><i class="ti ti-receipt-off"></i>尚無採購記錄</div>`:''}
    ${Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,list])=>{
      const mTotal=list.reduce((a,b)=>a+b.amount,0);
      return`<div class="month-header"><span>${m}</span><span>NT$ ${mTotal.toLocaleString()}</span></div>
      ${list.map(co=>{
        const unit=co.qty>0&&co.amount>0?Math.round(co.amount/co.qty):null;
        return`<div class="cost-item">
          <div class="date">${co.date.slice(5)}</div>
          <div class="info">
            <div class="item-name2">${co.item} × ${co.qty}</div>
            <div class="meta">${co.src}${co.note?' · '+co.note:''}${unit?` · 單價 NT$${unit.toLocaleString()}/個`:''}</div>
          </div>
          <div class="amount">NT$ ${co.amount.toLocaleString()}</div>
          <button class="btn icon btn-sm danger-outline" onclick="delCost(${co.id})"><i class="ti ti-trash" style="font-size:15px"></i></button>
        </div>`;
      }).join('')}`;
    }).join('')}`;
}
function delCost(id){if(!confirm('確定刪除？'))return;DATA.costs=DATA.costs.filter(c=>c.id!==id);save();renderCost();showToast('已刪除')}

function exportCost(){
  if(!DATA.costs.length){showToast('沒有記錄可匯出');return}
  const hdr='日期,物品,數量,來源,金額,單價,備註\n';
  const rows=DATA.costs.map(c=>[c.date,c.item,c.qty,c.src,c.amount,c.qty>0&&c.amount>0?Math.round(c.amount/c.qty):'',c.note||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+hdr+rows],{type:'text/csv;charset=utf-8'}));
  a.download=`採購記錄.csv`;a.click();showToast('已匯出');
}

// ── Brand Notes ──────────────────────────────────────────────────────────────
let detailItemId=null, editBrandIdx=null, starVal=0;

let detailTab='brand';

function openDetail(id){
  detailItemId=id;
  detailTab='brand';
  const item=DATA.items.find(i=>i.id===id);
  if(!item)return;
  document.getElementById('dt-title').textContent=item.name;
  switchDetailTab('brand');
  document.getElementById('detailModal').classList.add('open');
}

function switchDetailTab(tab){
  detailTab=tab;
  document.getElementById('dt-tab-brand').classList.toggle('active',tab==='brand');
  document.getElementById('dt-tab-history').classList.toggle('active',tab==='history');
  const addBtn=document.getElementById('dt-add-btn');
  if(addBtn)addBtn.style.display=tab==='brand'?'':'none';
  if(tab==='brand') renderBrands();
  else renderPurchaseHistory();
}

function renderPurchaseHistory(){
  const item=DATA.items.find(i=>i.id===detailItemId);
  if(!item)return;
  const costs=toArr(DATA.costs).filter(c=>c.item===item.name).sort((a,b)=>b.date.localeCompare(a.date));
  const el=document.getElementById('dt-body');
  if(!costs.length){
    el.innerHTML='<div class="empty" style="padding:2rem 0"><i class="ti ti-receipt-off" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無購買記錄<br><span style="font-size:13px">記帳時填入此品項名稱即可自動關聯</span></div>';
    return;
  }
  const total=costs.reduce((a,b)=>a+(b.amount||0),0);
  const totalQty=costs.reduce((a,b)=>a+(b.qty||0),0);
  const avgUnit=totalQty>0?Math.round(total/totalQty):null;
  el.innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1;background:var(--surface2);border-radius:var(--radius);padding:10px 12px">
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px">累計購買</div>
        <div style="font-size:18px;font-weight:600">${totalQty} ${item.unit}</div>
      </div>
      <div style="flex:1;background:var(--surface2);border-radius:var(--radius);padding:10px 12px">
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px">平均單價</div>
        <div style="font-size:18px;font-weight:600">${avgUnit!=null?'NT$ '+avgUnit:'—'}</div>
      </div>
    </div>
    ${costs.map(co=>{
      const unit=co.qty>0&&co.amount>0?Math.round(co.amount/co.qty):null;
      return`<div class="purchase-row">
        <div class="purchase-date">${co.date.replace(/^\d{4}-/,'')}</div>
        <div class="purchase-info">
          <div class="purchase-name">× ${co.qty} ${item.unit}</div>
          <div class="purchase-meta">${co.src||''}${co.note?' · '+co.note:''}</div>
        </div>
        <div style="text-align:right">
          <div class="purchase-amount">NT$ ${(co.amount||0).toLocaleString()}</div>
          ${unit?`<div class="purchase-unit">單價 NT$${unit}</div>`:''}
        </div>
      </div>`;
    }).join('')}`;
}

// ── Item picker for buy modal ─────────────────────────────────────────────
let pickerOpen=false;

function showItemPicker(){
  renderItemPicker('');
  document.getElementById('itemPickerList').classList.add('open');
  pickerOpen=true;
}
function hideItemPicker(){
  document.getElementById('itemPickerList').classList.remove('open');
  pickerOpen=false;
}
function toggleItemPicker(){
  if(pickerOpen){hideItemPicker();}
  else{document.getElementById('b-item').focus();showItemPicker();}
}
function filterItemPicker(q){
  if(!pickerOpen)return;
  renderItemPicker(q);
}
function renderItemPicker(q){
  const items=DATA.items.filter(i=>!q||i.name.includes(q));
  const el=document.getElementById('itemPickerList');
  if(!items.length){el.innerHTML='<div class="item-picker-opt" style="color:var(--text3)">沒有符合的品項</div>';return}
  el.innerHTML=items.map(i=>`<div class="item-picker-opt" onmousedown="pickItem('${i.name.replace(/'/g,"\'")}')">
    <span class="cat-dot" style="background:${catColor(i.cat)};display:inline-block;margin-right:6px"></span>${i.name}
    <span style="font-size:11px;color:var(--text3);margin-left:6px">${i.cat}</span>
  </div>`).join('');
}
function pickItem(name){
  document.getElementById('b-item').value=name;
  hideItemPicker();
}

function renderBrands(){
  const item=DATA.items.find(i=>i.id===detailItemId);
  const brands=item?toArr(item.brands):[];
  const el=document.getElementById('dt-body');
  if(!brands.length){
    el.innerHTML='<div class="empty" style="padding:2rem 0"><i class="ti ti-tag-off" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無品牌記錄<br><span style="font-size:13px">點上方「＋新增」開始記錄</span></div>';
    return;
  }
  el.innerHTML=brands.map((b,i)=>{
    const stars='★'.repeat(b.star||0)+'☆'.repeat(5-(b.star||0));
    const col=(b.star||0)>0?'#f59e0b':'#ccc';
    return`<div class="brand-card">
      <div class="brand-header">
        <div>
          <div class="brand-name">${b.name}</div>
          <div class="brand-stars" style="color:${col}">${stars}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn sm" onclick="openBrandForm(${i})"><i class="ti ti-edit"></i></button>
          <button class="btn sm danger-outline" onclick="delBrand(${i})"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="brand-meta">
        ${b.price?`<span>NT$ ${b.price}</span>`:''}
        ${b.src?`<span class="src-tag">${b.src}</span>`:''}
      </div>
      ${b.pros?`<div class="brand-pro"><span class="pro-con-label">✓ 優點</span>${b.pros}</div>`:''}
      ${b.cons?`<div class="brand-con"><span class="pro-con-label">✗ 缺點</span>${b.cons}</div>`:''}
      ${b.note?`<div class="brand-note-text">備註：${b.note}</div>`:''}
    </div>`;
  }).join('');
}

function openBrandForm(idx){
  editBrandIdx=(idx!==undefined)?idx:null;
  const item=DATA.items.find(i=>i.id===detailItemId);
  document.getElementById('br-src').innerHTML=['（未選擇）',...DATA.sources].map(s=>`<option>${s}</option>`).join('');
  if(editBrandIdx!==null){
    const b=toArr(item.brands)[editBrandIdx];
    document.getElementById('br-name').value=b.name||'';
    document.getElementById('br-price').value=b.price||'';
    document.getElementById('br-src').value=b.src||'（未選擇）';
    document.getElementById('br-pros').value=b.pros||'';
    document.getElementById('br-cons').value=b.cons||'';
    document.getElementById('br-note').value=b.note||'';
    setStar(b.star||0);
  } else {
    ['br-name','br-pros','br-cons','br-note'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('br-price').value='';
    setStar(0);
  }
  document.getElementById('brandModal').classList.add('open');
}

function setStar(n){
  starVal=n;
  const labels=['未評分','很差','普通','還好','不錯','強力推薦'];
  document.querySelectorAll('#br-stars button').forEach((btn,i)=>{
    btn.textContent=i<n?'★':'☆';
    btn.style.color=i<n?'#f59e0b':'#ccc';
  });
  const lbl=document.getElementById('br-star-label');
  if(lbl)lbl.textContent=n?labels[n]:'';
}

function saveBrand(){
  const name=document.getElementById('br-name').value.trim();
  if(!name){alert('請填品牌名稱');return}
  const item=DATA.items.find(i=>i.id===detailItemId);
  if(!item)return;
  if(!Array.isArray(item.brands))item.brands=[];
  const src=document.getElementById('br-src').value;
  const obj={
    name,
    price:parseInt(document.getElementById('br-price').value)||null,
    src:src==='（未選擇）'?'':src,
    star:starVal||null,
    pros:document.getElementById('br-pros').value.trim(),
    cons:document.getElementById('br-cons').value.trim(),
    note:document.getElementById('br-note').value.trim(),
  };
  if(editBrandIdx!==null)item.brands[editBrandIdx]=obj;
  else item.brands.push(obj);
  save();closeModal('brandModal');renderBrands();renderInv();
  showToast(editBrandIdx!==null?'已更新品牌':'已新增品牌');
}

function delBrand(idx){
  if(!confirm('確定刪除？'))return;
  const item=DATA.items.find(i=>i.id===detailItemId);
  if(!item)return;
  item.brands.splice(idx,1);
  save();renderBrands();renderInv();showToast('已刪除');
}

// Expose functions to global scope (needed for onclick handlers with type="module")
window.showPage=showPage;
window.chQty=chQty;
window.openItemModal=openItemModal;
window.saveItem=saveItem;
window.closeModal=closeModal;
window.setSrc=setSrc;
window.setCatFilter=setCatFilter;
window.setStatusFilter=setStatusFilter;
window.exportShopping=exportShopping;
window.openBuyModal=openBuyModal;
window.saveBuy=saveBuy;
window.delCost=delCost;
window.exportCost=exportCost;
window.addCat=addCat;
window.delCat=delCat;
window.addSrc=addSrc;
window.delSrc=delSrc;
window.doRestock=doRestock;
window.restockAll=restockAll;
window.openDetail=openDetail;
window.openBrandForm=openBrandForm;
window.setStar=setStar;
window.saveBrand=saveBrand;
window.delBrand=delBrand;
window.switchDetailTab=switchDetailTab;
window.showItemPicker=showItemPicker;
window.hideItemPicker=hideItemPicker;
window.toggleItemPicker=toggleItemPicker;
window.filterItemPicker=filterItemPicker;
window.pickItem=pickItem;
</script>

<!-- Brand form modal -->
<div class="modal-overlay" id="brandModal" onclick="if(event.target===this)closeModal('brandModal')">

    <div class="modal-handle"></div>
    <div class="modal-title">品牌資訊</div>
    <div class="modal-body">
      <div class="form-row"><label>品牌名稱 *</label><input type="text" id="br-name" placeholder="e.g. 花王、海倫仙度絲"></div>
      <div class="form-grid">
        <div class="form-row"><label>價格（NT$）</label><input type="number" id="br-price" min="0" inputmode="numeric"></div>

      </div>
      <div class="form-row">

            <button type="button" onclick="setStar(1)" style="font-size:30px;background:none;border:none;cursor:pointer;padding:0;color:#ccc;line-height:1">☆</button>
            <button type="button" onclick="setStar(2)" style="font-size:30px;background:none;border:none;cursor:pointer;padding:0;color:#ccc;line-height:1">☆</button>
            <button type="button" onclick="setStar(3)" style="font-size:30px;background:none;border:none;cursor:pointer;padding:0;color:#ccc;line-height:1">☆</button>
            <button type="button" onclick="setStar(4)" style="font-size:30px;background:none;border:none;cursor:pointer;padding:0;color:#ccc;line-height:1">☆</button>
            <button type="button" onclick="setStar(5)" style="font-size:30px;background:none;border:none;cursor:pointer;padding:0;color:#ccc;line-height:1">☆</button>
          </div>
          <span id="br-star-label" style="font-size:13px;color:var(--text3)"></span>
        </div>
      </div>
      <div class="form-row"><label>優點</label><textarea id="br-pros" placeholder="e.g. 洗完清爽、香味持久" rows="2"></textarea></div>
      <div class="form-row"><label>缺點</label><textarea id="br-cons" placeholder="e.g. 價格偏高、容量小" rows="2"></textarea></div>
      <div class="form-row"><label>其他備註</label><input type="text" id="br-note" placeholder="e.g. 特價時才買、家人推薦"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal('brandModal')">取消</button>
      <button class="btn primary" style="flex:2;justify-content:center" onclick="saveBrand()">儲存</button>
    </div>
  </div>
</div>
