<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>家庭庫存</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#f0f0f0;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.15);
  --accent:#2563eb;--green:#16a34a;--green-bg:#f0fdf4;
  --amber:#b45309;--amber-bg:#fffbeb;
  --red:#dc2626;--red-bg:#fef2f2;
  --radius:10px;--radius-lg:14px;
  --tab-h:60px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{background:var(--surface);border-bottom:0.5px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:50px}
.header-title{font-size:17px;font-weight:600}
.header-actions{display:flex;gap:6px;align-items:center}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px;padding-bottom:calc(var(--tab-h) + var(--safe-bottom) + 16px)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:0.5px solid var(--border);display:flex;height:calc(var(--tab-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);z-index:50}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--text3);font-size:10px;font-family:inherit;padding:6px 4px}
.nav-btn i{font-size:22px}
.nav-btn.active{color:var(--accent)}
.nav-badge{position:absolute;top:5px;right:calc(50% - 18px);background:var(--red);color:#fff;border-radius:10px;padding:1px 5px;font-size:10px;min-width:16px;text-align:center}
.nav-item-wrap{position:relative;flex:1;display:flex}
.nav-item-wrap .nav-btn{flex:1}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);font-size:13px;background:var(--surface);color:var(--text);font-family:inherit}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:6px;border-radius:8px}
.btn.danger-outline{color:var(--red);border-color:rgba(220,38,38,.3);background:transparent}
.btn i{font-size:15px}

/* Form */
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--surface2);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent);background:var(--surface)}
.form-row{margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:12px;color:var(--text3)}
.stat-value{font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat-value.warn{color:var(--amber)}.stat-value.danger{color:var(--red)}

/* Alert */
.alert{background:var(--amber-bg);border:0.5px solid #fac775;border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:#633806}
.alert i{font-size:18px;color:var(--amber);flex-shrink:0}
.alert.hidden{display:none}

/* Filter chips */
.chip-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);font-size:13px;white-space:nowrap;background:var(--surface);color:var(--text2);font-family:inherit;flex-shrink:0}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Badges */
.badge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:500}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.low{background:var(--amber-bg);color:var(--amber)}
.badge.out{background:var(--red-bg);color:var(--red)}
.cat-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.src-tag{background:var(--surface2);padding:1px 6px;border-radius:3px;font-size:11px;color:var(--text2)}

/* Item card */
.item-card{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.item-info{flex:1;min-width:0;cursor:pointer}
.item-name{font-size:15px;font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-meta{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qty-control{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:32px;height:32px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text);font-family:inherit}
.qty-btn:active{background:var(--border2)}
.qty-num{font-size:16px;font-weight:600;min-width:26px;text-align:center}
.qty-num.low{color:var(--amber)}.qty-num.out{color:var(--red)}

/* Shopping */
.shop-section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.shop-card{background:var(--surface);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
.shop-card-top{display:flex;align-items:center;gap:10px;margin-bottom:0}
.shop-card-top .name{font-size:15px;font-weight:500;flex:1}
.shop-card-top .detail{font-size:12px;color:var(--text2);margin-top:2px}
.restock-panel{margin-top:10px;padding-top:10px;border-top:0.5px solid var(--border);display:none}
.restock-panel.open{display:block}
.restock-row1{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.restock-row2{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.restock-row3{position:relative}
.ri-input{flex:1;padding:8px 10px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);font-size:15px;text-align:center;min-width:0}
.ri-label{font-size:13px;color:var(--text3);flex-shrink:0;white-space:nowrap}
.cny-btn{padding:6px 10px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface);font-size:12px;font-family:inherit;color:var(--text2);white-space:nowrap;flex-shrink:0}
.cny-btn.active{background:#ffedd5;color:#c2410c;border-color:#fed7aa}
.confirm-btn{width:100%;padding:11px;border-radius:10px;background:var(--green);color:#fff;border:none;font-size:15px;font-weight:500;font-family:inherit;margin-top:4px}
.confirm-btn:active{opacity:.85}
.confirm-btn.done{background:#9ca3af}
.expand-btn{padding:5px 10px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface2);font-size:12px;font-family:inherit;color:var(--text2)}

/* Brand autocomplete */
.ac-wrap{position:relative}
.ac-list{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:180px;overflow-y:auto;z-index:300;margin-top:2px}
.ac-list.open{display:block}
.ac-item{padding:10px 14px;font-size:14px;border-bottom:0.5px solid var(--border);cursor:pointer}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--surface2)}

/* Item picker */
.ip-wrap{position:relative}
.ip-row{display:flex;gap:6px}
.ip-list{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:200px;overflow-y:auto;z-index:300;margin-top:2px}
.ip-list.open{display:block}
.ip-item{padding:10px 14px;font-size:14px;border-bottom:0.5px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px}
.ip-item:last-child{border-bottom:none}
.ip-item:active{background:var(--surface2)}
.ip-item .ip-cat{font-size:11px;color:var(--text3);margin-left:auto}

/* Cost */
.cost-summary{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.cost-range-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.cost-range-row input[type=date]{flex:1;font-size:14px;padding:8px 10px}
.cost-range-label{font-size:13px;color:var(--text3);flex-shrink:0}
.cost-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cost-stat{background:var(--surface2);border-radius:8px;padding:10px 12px}
.cost-stat-label{font-size:11px;color:var(--text3);margin-bottom:2px}
.cost-stat-val{font-size:18px;font-weight:600}
.cost-month-header{font-size:13px;font-weight:500;color:var(--text2);padding:10px 0 6px;display:flex;justify-content:space-between;border-top:0.5px solid var(--border);margin-top:4px}
.cost-month-header:first-of-type{border-top:none;margin-top:0}
.cost-item{background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
.cost-date{font-size:12px;color:var(--text3);min-width:48px;flex-shrink:0;padding-top:1px}
.cost-info{flex:1;min-width:0}
.cost-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost-meta{font-size:12px;color:var(--text3);margin-top:2px}
.cost-right{text-align:right;flex-shrink:0}
.cost-amount{font-size:15px;font-weight:600}
.cost-unit-price{font-size:11px;color:var(--text3);margin-top:1px}
.cost-actions{display:flex;gap:5px;flex-shrink:0;align-items:flex-start}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);margin-bottom:10px}
.sortable-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sortable-item{background:var(--surface);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:10px;border:0.5px solid var(--border)}
.sortable-handle{color:var(--text3);font-size:20px;cursor:grab;flex-shrink:0;touch-action:none}
.sortable-handle:active{cursor:grabbing}
.sortable-name{flex:1;font-size:14px}
.sortable-name.editing input{width:100%;font-size:14px;padding:4px 8px;border-radius:6px;border:0.5px solid var(--accent);background:var(--surface)}
.add-row{display:flex;gap:8px;align-items:center}
.add-row input{flex:1;padding:10px 12px;border-radius:var(--radius);border:0.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:15px}
input[type=color]{width:40px;height:40px;padding:3px;border-radius:8px;border:0.5px solid var(--border2);background:var(--surface);cursor:pointer}

.shop-mode-btn{flex:1;padding:8px 6px;border-radius:10px;border:none;background:transparent;font-size:13px;font-family:inherit;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.shop-mode-btn.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* Detail modal tabs */
.dt-tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;margin:10px 16px 0}
.dt-tab{flex:1;padding:7px;border:none;background:transparent;border-radius:8px;font-size:13px;color:var(--text3);font-family:inherit;cursor:pointer}
.dt-tab.active{background:var(--surface);color:var(--text);font-weight:500}

/* Brand card */
.brand-card{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.brand-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.brand-name{font-size:15px;font-weight:600}
.brand-stars{font-size:17px;letter-spacing:2px}
.brand-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--text2);margin-bottom:6px}
.brand-pro{color:var(--green);font-size:13px;margin-top:3px}
.brand-con{color:var(--red);font-size:13px;margin-top:3px}
.brand-note-text{font-size:13px;color:var(--text2);margin-top:3px}
.pro-con-label{font-weight:600;margin-right:4px}

/* Purchase history */
.purchase-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.purchase-row:last-child{border-bottom:none}
.purchase-date{font-size:12px;color:var(--text3);min-width:52px;flex-shrink:0;padding-top:1px}
.purchase-info{flex:1}
.purchase-amount{font-size:14px;font-weight:600;text-align:right;flex-shrink:0}
.purchase-unit{font-size:11px;color:var(--text3)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 14px}
.modal-title{font-size:16px;font-weight:600;padding:0 16px 12px;border-bottom:0.5px solid var(--border)}
.modal-body{padding:14px 16px}
.modal-footer{padding:10px 16px 0;display:flex;gap:10px}

/* Cost edit modal */
.edit-modal-body{padding:14px 16px}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--text3)}
.empty i{font-size:32px;display:block;margin-bottom:8px}
.toast{position:fixed;bottom:calc(var(--tab-h) + var(--safe-bottom) + 10px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:500}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="header" id="mainHeader">
    <span class="header-title" id="headerTitle">庫存</span>
    <div class="header-actions" id="headerActions"></div>
  </div>
  <div class="content" id="mainContent"></div>
  <nav class="bottom-nav">
    <div class="nav-item-wrap">
      <button class="nav-btn active" id="navInv" onclick="showPage('inv')"><i class="ti ti-package"></i><span>庫存</span></button>
      <span class="nav-badge" id="navBadge" style="display:none"></span>
    </div>
    <button class="nav-btn" id="navShop" onclick="showPage('shop')"><i class="ti ti-shopping-cart"></i><span>購物清單</span></button>
    <button class="nav-btn" id="navCost" onclick="showPage('cost')"><i class="ti ti-receipt"></i><span>成本</span></button>
    <button class="nav-btn" id="navSettings" onclick="showPage('settings')"><i class="ti ti-settings"></i><span>設定</span></button>
  </nav>
</div>

<!-- Item Modal -->
<div class="modal-overlay" id="itemModal" onclick="if(event.target===this)closeModal('itemModal')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="itemModalTitle">新增物品</div>
    <div class="modal-body">
      <div class="form-row"><label>物品名稱</label><input type="text" id="f-name" placeholder="e.g. 洗髮精"></div>
      <div class="form-grid">
        <div class="form-row"><label>分類</label><select id="f-cat"></select></div>
        <div class="form-row"><label>單位</label><input type="text" id="f-unit" placeholder="瓶、包、罐"></div>
        <div class="form-row"><label>目前庫存</label><input type="number" id="f-qty" min="0" inputmode="numeric"></div>
        <div class="form-row"><label>補貨門檻</label><input type="number" id="f-min" min="0" inputmode="numeric"></div>
      </div>
      <div class="form-row"><label>建議補貨量（選填）</label><input type="number" id="f-reorder" min="0" inputmode="numeric" placeholder="每次買幾個"></div>
      <div class="form-row"><label>採購來源（可複選）</label><div class="checkbox-group" style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0" id="f-src-group"></div></div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal('itemModal')">取消</button>
      <button class="btn primary" style="flex:2;justify-content:center" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<!-- Buy Modal -->
<div class="modal-overlay" id="buyModal" onclick="if(event.target===this)closeModal('buyModal')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">記錄採購</div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row"><label>採購日期</label><input type="date" id="b-date"></div>
        <div class="form-row"><label>採購來源</label><select id="b-src"></select></div>
      </div>
      <div class="form-row">
        <label>物品名稱</label>
        <div class="ip-wrap">
          <div class="ip-row">
            <input type="text" id="b-item" placeholder="e.g. 洗髮精" style="flex:1" oninput="filterIpList(this.value,'buy')" onfocus="openIpList('buy')" onblur="setTimeout(()=>closeIpList('buy'),200)">
            <button type="button" class="btn sm" onclick="toggleIpList('buy')" style="flex-shrink:0"><i class="ti ti-list" style="font-size:17px"></i></button>
          </div>
          <div class="ip-list" id="ipList-buy"></div>
        </div>
      </div>
      <div class="form-row">
        <label>品牌／口味（選填）</label>
        <div class="ac-wrap">
          <input type="text" id="b-brand" placeholder="e.g. 花王、原味" oninput="filterBrandAc(this.value,'buy')" onfocus="openBrandAc('buy')" onblur="setTimeout(()=>closeBrandAc('buy'),200)">
          <div class="ac-list" id="brandAc-buy"></div>
        </div>
      </div>
      <div class="form-grid">
        <div class="form-row"><label>數量</label><input type="number" id="b-qty" min="1" inputmode="numeric" value="1"></div>
        <div class="form-row">
          <label>金額</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="number" id="b-amount" min="0" inputmode="numeric" style="flex:1">
            <button type="button" class="cny-btn" id="b-cny-btn" onclick="toggleCny('b')">CNY</button>
          </div>
          <div id="b-cny-hint" style="font-size:11px;color:var(--text3);margin-top:3px;display:none"></div>
        </div>
      </div>
      <div class="form-row">
        <label>重量（選填，計算每百克單價）</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="b-weight" min="0" inputmode="numeric" placeholder="克數" style="flex:1" oninput="updateWeightHint('b')">
          <span style="font-size:13px;color:var(--text3);flex-shrink:0">克</span>
        </div>
        <div id="b-weight-hint" style="font-size:12px;color:var(--accent);margin-top:3px;display:none"></div>
      </div>
      <div class="form-row"><label>備註（選填）</label><input type="text" id="b-note" placeholder="e.g. 特價、買二送一"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" style="flex:1;justify-content:center" onclick="closeModal('buyModal')">取消</button>
      <button class="btn primary" style="flex:2;justify-content:center" onclick="saveBuy()">儲存並更新庫存</button>
    </div>
  </div>
</div>

<!-- Cost Edit Modal -->
<div class="modal-overlay" id="costEditModal" onclick="if(event.target===this)closeModal('costEditModal')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">編輯採購記錄</div>
    <div class="edit-modal-body">
      <div class="form-grid">
        <div class="form-row"><label>採購日期</label><input type="date" id="ce-date"></div>
        <div class="form-row"><label>採購來源</label><select id="ce-src"></select></div>
      </div>
      <div class="form-row"><label>物品名稱</label><input type="text" id="ce-item"></div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBzWK76cZTIKEoJGoc9bqi0M4sGLIMsUaE",
  authDomain: "good-e9e4e.firebaseapp.com",
  databaseURL: "https://good-e9e4e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "good-e9e4e",
  storageBucket: "good-e9e4e.firebasestorage.app",
  messagingSenderId: "878748843198",
  appId: "1:878748843198:web:6183a33453463ef8e2b2ef"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const dataRef = ref(db, 'inventory');

// ── helpers ───────────────────────────────────────────────────────────────
function toArr(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(x=>x!=null);
  if(typeof v==='object') return Object.values(v).filter(x=>x!=null);
  return [];
}
function sanitize(d){
  d.cats    = toArr(d.cats);
  d.sources = toArr(d.sources);
  d.costs   = toArr(d.costs);
  d.items   = toArr(d.items).map(item=>({
    ...item, sources:toArr(item.sources), brands:toArr(item.brands)
  }));
  return d;
}
const DEFAULT = {
  cats:[
    {name:'日用品',color:'#2563eb'},{name:'飲料',color:'#16a34a'},{name:'零食',color:'#ea580c'},
    {name:'貓砂飼料',color:'#7c3aed'},{name:'清潔用品',color:'#db2777'},{name:'藥品保健',color:'#b45309'},{name:'其他',color:'#6b7280'}
  ],
  sources:['蝦皮','家樂福','五金行','藥妝店','超商'],
  items:[
    {id:1,name:'洗髮精',cat:'日用品',qty:1,min:2,unit:'瓶',reorder:3,sources:['蝦皮'],brands:[]},
    {id:2,name:'沐浴乳',cat:'日用品',qty:3,min:2,unit:'瓶',reorder:2,sources:['蝦皮','家樂福'],brands:[]},
    {id:3,name:'衛生紙',cat:'日用品',qty:2,min:3,unit:'包',reorder:5,sources:['家樂福'],brands:[]},
    {id:4,name:'可樂',cat:'飲料',qty:6,min:4,unit:'罐',reorder:12,sources:['家樂福','超商'],brands:[]},
    {id:5,name:'礦泉水',cat:'飲料',qty:1,min:6,unit:'瓶',reorder:12,sources:['家樂福'],brands:[]},
    {id:6,name:'洋芋片',cat:'零食',qty:0,min:2,unit:'包',reorder:4,sources:['超商','蝦皮'],brands:[]},
    {id:7,name:'貓飼料',cat:'貓砂飼料',qty:2,min:3,unit:'包',reorder:4,sources:['蝦皮'],brands:[]},
    {id:8,name:'貓砂',cat:'貓砂飼料',qty:4,min:2,unit:'包',reorder:3,sources:['蝦皮','五金行'],brands:[]},
    {id:9,name:'洗碗精',cat:'清潔用品',qty:2,min:1,unit:'瓶',reorder:2,sources:['家樂福'],brands:[]},
  ],
  costs:[],
};

let DATA;
try { DATA = sanitize(JSON.parse(localStorage.getItem('hiv3')||'null') || JSON.parse(JSON.stringify(DEFAULT))); }
catch(e){ DATA = JSON.parse(JSON.stringify(DEFAULT)); }

let nextItemId = DATA.items.length ? Math.max(10,...DATA.items.map(i=>i.id+1)) : 10;
let nextCostId = DATA.costs.length ? Math.max(1,...DATA.costs.map(c=>c.id+1)) : 1;
let currentPage = 'inv';
let editItemId = null;
let detailItemId = null;
let detailTab = 'brand';
let editBrandIdx = null;
let starVal = 0;
let activeSrc = 'all';
let activeCatFilter = 'all';
let activeStatusFilter = 'all';
let cnyRate = 4.4;
let bCnyMode = false;
let shopCnyModes = {};
let editCostId = null;
let dragSrc = null;
let costRangeFrom = '';
let costRangeTo = '';

function save(){
  localStorage.setItem('hiv3',JSON.stringify(DATA));
  set(dataRef,DATA).catch(()=>{});
}
function catColor(n){return(DATA.cats.find(c=>c.name===n)||{color:'#6b7280'}).color}
function itemStatus(item){if(item.qty===0)return'out';if(item.qty<=item.min)return'low';return'ok'}
function statusLabel(s){return{ok:'正常',low:'即將不足',out:'已用完'}[s]}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function closeModal(id){document.getElementById(id).classList.remove('open')}

// ── Firebase sync ────────────────────────────────────────────────────────
showPage('inv');
onValue(dataRef, snap=>{
  const remote=snap.val();
  if(remote){ DATA=sanitize(remote); localStorage.setItem('hiv3',JSON.stringify(DATA)); }
  else set(dataRef,DATA).catch(()=>{});
  nextItemId=DATA.items.length?Math.max(10,...DATA.items.map(i=>i.id+1)):10;
  nextCostId=DATA.costs.length?Math.max(1,...DATA.costs.map(c=>c.id+1)):1;
  showPage(currentPage);
},{onlyOnce:false});

// ── CNY rate fetch ───────────────────────────────────────────────────────
fetch('https://open.er-api.com/v6/latest/CNY').then(r=>r.json()).then(d=>{
  if(d.rates&&d.rates.TWD) cnyRate=d.rates.TWD;
}).catch(()=>{});

// ── Navigation ───────────────────────────────────────────────────────────
function showPage(p){
  currentPage=p;
  ['Inv','Shop','Cost','Settings'].forEach(n=>document.getElementById('nav'+n).classList.remove('active'));
  const map={inv:'Inv',shop:'Shop',cost:'Cost',settings:'Settings'};
  document.getElementById('nav'+map[p]).classList.add('active');
  const titles={inv:'庫存',shop:'購物清單',cost:'成本記錄',settings:'設定'};
  document.getElementById('headerTitle').textContent=titles[p];
  const ha=document.getElementById('headerActions');
  if(p==='inv') ha.innerHTML=`<button class="btn primary sm" onclick="openItemModal()"><i class="ti ti-plus"></i> 新增</button>`;
  else if(p==='shop') ha.innerHTML=`<button class="btn sm" onclick="exportShopping()"><i class="ti ti-download"></i></button><button class="btn primary sm" onclick="openBuyModal()"><i class="ti ti-cash"></i> 記帳</button>`;
  else if(p==='cost') ha.innerHTML=`<button class="btn sm" onclick="exportCost()"><i class="ti ti-download"></i></button>`;
  else ha.innerHTML='';
  const c=document.getElementById('mainContent');
  if(p==='inv') renderInv(c);
  else if(p==='shop') renderShop(c);
  else if(p==='cost') renderCost(c);
  else renderSettings(c);
}

// ── Inventory ────────────────────────────────────────────────────────────
function renderInv(c){
  if(!c)c=document.getElementById('mainContent');
  if(!DATA||!DATA.items){c.innerHTML='<div class="empty"><i class="ti ti-loader"></i>載入中…</div>';return}
  const low=DATA.items.filter(i=>itemStatus(i)==='low').length;
  const out=DATA.items.filter(i=>itemStatus(i)==='out').length;
  const need=low+out;
  const badge=document.getElementById('navBadge');
  if(need>0){badge.style.display='block';badge.textContent=need}else badge.style.display='none';
  const cats=['all',...new Set(DATA.items.map(i=>i.cat))];
  const filtered=DATA.items.filter(i=>{
    if(activeCatFilter!=='all'&&i.cat!==activeCatFilter)return false;
    if(activeStatusFilter!=='all'&&itemStatus(i)!==activeStatusFilter)return false;
    return true;
  });
  c.innerHTML=`
    ${need>0?`<div class="alert"><i class="ti ti-alert-triangle"></i><span>有 ${need} 項需補貨（${out} 已用完、${low} 即將不足）</span></div>`:''}
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">總品項</div><div class="stat-value">${DATA.items.length}</div></div>
      <div class="stat-card"><div class="stat-label">需補貨</div><div class="stat-value ${need>0?'danger':''}">${need}</div></div>
    </div>
    <div class="chip-row">${cats.map(c=>`<button class="chip ${activeCatFilter===c?'active':''}" onclick="setCatF('${c}')">${c==='all'?'全部':c}</button>`).join('')}</div>
    <div class="chip-row">
      <button class="chip ${activeStatusFilter==='all'?'active':''}" onclick="setStatusF('all')">全部</button>
      <button class="chip ${activeStatusFilter==='ok'?'active':''}" onclick="setStatusF('ok')">正常</button>
      <button class="chip ${activeStatusFilter==='low'?'active':''}" onclick="setStatusF('low')">即將不足</button>
      <button class="chip ${activeStatusFilter==='out'?'active':''}" onclick="setStatusF('out')">已用完</button>
    </div>
    ${filtered.length===0?`<div class="empty"><i class="ti ti-box-off"></i>沒有符合條件的物品</div>`:''}
    ${filtered.map(item=>{
      const s=itemStatus(item);const qc=s==='out'?'out':s==='low'?'low':'';
      const bc=toArr(item.brands).length;
      const srcs=toArr(item.sources).map(s=>`<span class="src-tag">${s}</span>`).join(' ');
      return`<div class="item-card">
        <div class="item-info" onclick="openDetail(${item.id})">
          <div class="item-name">${item.name}${bc?`<span style="font-size:11px;color:var(--accent);margin-left:6px;font-weight:400">${bc}個品牌</span>`:''}</div>
          <div class="item-meta"><span class="cat-dot" style="background:${catColor(item.cat)}"></span><span>${item.cat}</span>${srcs?`<span>·</span>${srcs}`:''}</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" onclick="chQty(${item.id},-1)">−</button>
          <div><div class="qty-num ${qc}" style="text-align:center">${item.qty}</div><div style="font-size:10px;color:var(--text3);text-align:center">${item.unit}</div></div>
          <button class="qty-btn" onclick="chQty(${item.id},1)">＋</button>
        </div>
        <button class="btn icon" onclick="openItemModal(${item.id})" style="align-self:flex-start"><i class="ti ti-dots-vertical" style="font-size:18px"></i></button>
      </div>`;
    }).join('')}`;
}
function setCatF(v){activeCatFilter=v;renderInv()}
function setStatusF(v){activeStatusFilter=v;renderInv()}
function chQty(id,d){const i=DATA.items.find(x=>x.id===id);if(!i)return;i.qty=Math.max(0,i.qty+d);save();renderInv()}

function openItemModal(id){
  editItemId=id||null;
  document.getElementById('f-cat').innerHTML=DATA.cats.map(c=>`<option value="${c.name}">${c.name}</option>`).join('');
  document.getElementById('f-src-group').innerHTML=DATA.sources.map(s=>`<label style="display:flex;align-items:center;gap:6px;font-size:14px;padding:7px 12px;background:var(--surface2);border-radius:8px;cursor:pointer;font-weight:400"><input type="checkbox" value="${s}" style="width:18px;height:18px;accent-color:var(--accent)"> ${s}</label>`).join('');
  if(id){
    const item=DATA.items.find(x=>x.id===id);
    document.getElementById('itemModalTitle').textContent='編輯物品';
    document.getElementById('f-name').value=item.name;
    document.getElementById('f-cat').value=item.cat;
    document.getElementById('f-unit').value=item.unit||'';
    document.getElementById('f-qty').value=item.qty;
    document.getElementById('f-min').value=item.min;
    document.getElementById('f-reorder').value=item.reorder||'';
    document.querySelectorAll('#f-src-group input').forEach(cb=>{if(toArr(item.sources).includes(cb.value))cb.checked=true});
  } else {
    document.getElementById('itemModalTitle').textContent='新增物品';
    ['f-name','f-unit','f-reorder'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-qty').value='0';document.getElementById('f-min').value='2';
  }
  document.getElementById('itemModal').classList.add('open');
}
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){alert('請填物品名稱');return}
  const srcs=[...document.querySelectorAll('#f-src-group input:checked')].map(c=>c.value);
  const obj={id:editItemId||nextItemId++,name,cat:document.getElementById('f-cat').value,unit:document.getElementById('f-unit').value.trim()||'個',qty:parseInt(document.getElementById('f-qty').value)||0,min:parseInt(document.getElementById('f-min').value)||1,reorder:parseInt(document.getElementById('f-reorder').value)||null,sources:srcs,brands:editItemId?(DATA.items.find(i=>i.id===editItemId)||{brands:[]}).brands:[]};
  if(editItemId)DATA.items=DATA.items.map(i=>i.id===editItemId?obj:i);
  else DATA.items.push(obj);
  save();closeModal('itemModal');renderInv();showToast(editItemId?'已更新':'已新增');
}
function delItem(id){if(!confirm('確定刪除？'))return;DATA.items=DATA.items.filter(i=>i.id!==id);save();renderInv();showToast('已刪除')}

// ── Shopping ─────────────────────────────────────────────────────────────
let shopTab='need';
let shopSearchQ='';

function renderShop(c){
  if(!c)c=document.getElementById('mainContent');
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  const okItems=DATA.items.filter(i=>itemStatus(i)==='ok');
  const list=shopTab==='need'?need:okItems;
  const allSrcs=['all',...new Set(need.flatMap(i=>toArr(i.sources)))];
  const shown=(activeSrc==='all'?list:list.filter(i=>toArr(i.sources).includes(activeSrc))).filter(i=>!shopSearchQ||i.name.includes(shopSearchQ));
  const byCat={};
  shown.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i)});

  c.innerHTML=`
    <div style="position:relative;margin-bottom:10px">
      <i class="ti ti-search" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px;pointer-events:none"></i>
      <input type="text" id="shopSearch" placeholder="搜尋品項…" value="${shopSearchQ}" style="padding-left:36px;background:var(--surface);border-color:var(--border)">
    </div>
    <div style="display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:12px;margin-bottom:12px">
      <button class="shop-mode-btn ${shopTab==='need'?'active':''}" onclick="setShopTab('need')">
        需補貨 ${need.length>0?`<span style="background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:3px">${need.length}</span>`:''}
      </button>
      <button class="shop-mode-btn ${shopTab==='ok'?'active':''}" onclick="setShopTab('ok')">
        預先採買 <span style="font-size:11px;color:var(--text3);margin-left:2px">${okItems.length}</span>
      </button>
    </div>
    <div class="chip-row">${allSrcs.map(s=>`<button class="chip ${s===activeSrc?'active':''}" onclick="setSrc('${s}')">${s==='all'?'全部來源':s}</button>`).join('')}</div>
    <div id="shopItemsArea"></div>`;
  renderShopItems();
  bindShopSearch();
}

function renderShopItems(){
  const el=document.getElementById('shopItemsArea');
  if(!el)return;
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  const okItems=DATA.items.filter(i=>itemStatus(i)==='ok');
  const list=shopTab==='need'?need:okItems;
  const shown=(activeSrc==='all'?list:list.filter(i=>toArr(i.sources).includes(activeSrc))).filter(i=>!shopSearchQ||i.name.includes(shopSearchQ));
  const byCat={};
  shown.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i)});
  el.innerHTML=shown.length===0
    ?`<div class="empty"><i class="ti ti-circle-check" style="color:var(--green)"></i>${shopTab==='need'?'此來源無需採購物品':'沒有庫存正常的品項'}</div>`
    :Object.entries(byCat).map(([cat,list])=>`
      <div class="shop-section-label"><span class="cat-dot" style="background:${catColor(cat)}"></span>${cat}</div>
      ${list.map(item=>shopCard(item,shopTab==='ok')).join('')}`).join('');
}
function setShopTab(t){shopTab=t;if(document.getElementById('shopItemsArea'))renderShopItems();else renderShop();}
function setShopSearch(q){shopSearchQ=q;renderShop()}
function bindShopSearch(){
  const el=document.getElementById('shopSearch');
  if(!el)return;
  let composing=false;
  el.addEventListener('compositionstart',()=>{composing=true});
  el.addEventListener('compositionend',()=>{
    composing=false;
    shopSearchQ=el.value;
    renderShopItems();
  });
  el.addEventListener('input',()=>{
    if(!composing){shopSearchQ=el.value;renderShopItems();}
  });
}
function shopCard(item,isOk){
  const s=itemStatus(item);
  const suggest=item.reorder?item.reorder:item.min+1;
  const suggestTxt=item.reorder?`建議補 ${item.reorder} ${item.unit}`:`補至 ${item.min+1} ${item.unit}以上`;
  const cny=shopCnyModes[item.id]||false;
  return`<div class="shop-card" id="shop-${item.id}">
    <div class="shop-card-top">
      <div style="flex:1">
        <div class="name">${item.name}${isOk?` <span class="badge ok" style="font-size:10px">正常</span>`:''}</div>
        <div class="detail">目前 ${item.qty} ${item.unit}${isOk?'':`・${suggestTxt}`}</div>
      </div>
      ${isOk?'':`<span class="badge ${s}">${statusLabel(s)}</span>`}
      <button class="expand-btn" onclick="toggleRestock(${item.id})">${isOk?'預購':'補貨'}</button>
    </div>
    <div class="restock-panel" id="rp-${item.id}">
      <div class="restock-row1">
        <input class="ri-input" type="number" id="ri-${item.id}" value="${isOk?1:suggest}" min="1" inputmode="numeric" placeholder="數量">
        <span class="ri-label">${item.unit}</span>
        <span class="ri-label">NT$</span>
        <input class="ri-input" type="number" id="ra-${item.id}" min="0" inputmode="numeric" placeholder="金額">
        <button class="cny-btn ${cny?'active':''}" onclick="toggleShopCny(${item.id})">CNY</button>
      </div>

function toggleShopCny(id){
  shopCnyModes[id]=!shopCnyModes[id];
  const btn=document.querySelector(`#shop-${id} .cny-btn`);
  if(btn)btn.classList.toggle('active',shopCnyModes[id]);
  updateShopCnyHint(id);
}
function updateShopCnyHint(id){
  const hint=document.getElementById('shop-cny-hint-'+id);
  const amt=parseFloat(document.getElementById('ra-'+id)?.value)||0;
  if(!hint)return;
  if(shopCnyModes[id]&&amt>0){
    hint.style.display='block';
    hint.textContent=`≈ NT$ ${Math.round(amt*cnyRate)}（匯率 ${cnyRate.toFixed(2)}）`;
  } else hint.style.display='none';
}
function updateShopWeightHint(id){
  const w=parseFloat(document.getElementById('rw-'+id)?.value)||0;
  const amt=parseFloat(document.getElementById('ra-'+id)?.value)||0;
  const qty=parseFloat(document.getElementById('ri-'+id)?.value)||1;
  const hint=document.getElementById('sw-hint-'+id);
  if(!hint)return;
  const twdAmt=shopCnyModes[id]?amt*cnyRate:amt;
  if(w>0&&twdAmt>0&&qty>0){
    const per100=Math.round((twdAmt/qty/(w/100))*100)/100;
    hint.textContent=`每百克 NT$${per100}`;
  } else hint.textContent='';
}

function doRestock(id){
  const item=DATA.items.find(i=>i.id===id);
  if(!item)return;
  const qty=parseInt(document.getElementById('ri-'+id).value)||0;
  if(qty<=0){showToast('請輸入補貨數量');return}
  const rawAmt=parseFloat(document.getElementById('ra-'+id).value)||0;
  const amount=shopCnyModes[id]?Math.round(rawAmt*cnyRate):rawAmt;
  const brandName=(document.getElementById('rbrand-'+id)?.value||'').trim();
  const src=activeSrc==='all'?(toArr(item.sources)[0]||''):activeSrc;
  const weight=parseFloat(document.getElementById('rw-'+id)?.value)||null;
  item.qty+=qty;
  if(amount>0){
    if(!Array.isArray(DATA.costs))DATA.costs=[];
    const unitPrice=qty>0&&amount>0?Math.round(amount/qty):null;
    const per100g=weight&&amount&&qty?Math.round((amount/qty/(weight/100))*100)/100:null;
    DATA.costs.unshift({id:nextCostId++,date:new Date().toISOString().slice(0,10),src,item:item.name,brand:brandName||'',qty,amount,weight:weight||null,unitPrice,per100g,note:brandName?`品牌：${brandName}`:'購物清單補貨'});
  }
  if(brandName){
    if(!Array.isArray(item.brands))item.brands=[];
    const unitPrice=qty>0&&amount>0?Math.round(amount/qty):null;
    const ex=item.brands.find(b=>b.name===brandName);
    if(ex){if(unitPrice!=null)ex.price=unitPrice;}
    else item.brands.push({name:brandName,price:unitPrice,src,star:null,pros:'',cons:'',note:`${new Date().toLocaleDateString('zh-TW')} 自動新增`});
  }
  save();
  const btn=document.getElementById('rb-'+id);
  if(btn){btn.textContent='✓ 已補貨';btn.classList.add('done');btn.disabled=true}
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok').length;
  const badge=document.getElementById('navBadge');
  if(need>0){badge.style.display='block';badge.textContent=need}else badge.style.display='none';
  showToast(`${item.name} 補 ${qty} ${item.unit}${amount>0?`，NT$${amount}已記帳`:''}${brandName?`，${brandName}存入品牌筆記`:''}`);
}

function exportShopping(){
  const need=DATA.items.filter(i=>itemStatus(i)!=='ok');
  if(!need.length){showToast('目前沒有需要採購的物品');return}
  const today=new Date().toLocaleDateString('zh-TW');
  const srcs=activeSrc==='all'?[...new Set(need.flatMap(i=>toArr(i.sources)))]:[activeSrc];
  let txt=`購物清單 ${today}\n${'─'.repeat(26)}\n`;
  srcs.forEach(src=>{
    const list=need.filter(i=>toArr(i.sources).includes(src));
    if(!list.length)return;
    txt+=`\n【${src}】\n`;
    list.forEach(i=>{ txt+=`  ☐ ${i.name} — ${i.reorder?`補 ${i.reorder} ${i.unit}`:`補至 ${i.min+1} ${i.unit}以上`}\n`; });
  });
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=`購物清單_${today}.txt`;a.click();showToast('已匯出');
}

function saveBuy(){
  const itemName=document.getElementById('b-item').value.trim();
  if(!itemName){alert('請填物品名稱');return}
  const brandName=document.getElementById('b-brand').value.trim();
  const qty=parseInt(document.getElementById('b-qty').value)||1;
  const rawAmt=parseFloat(document.getElementById('b-amount').value)||0;
  const amount=bCnyMode?Math.round(rawAmt*cnyRate):rawAmt;
  const weight=parseFloat(document.getElementById('b-weight').value)||null;
  const src=document.getElementById('b-src').value;
  const note=document.getElementById('b-note').value.trim();
  const unitPrice=qty>0&&amount>0?Math.round(amount/qty):null;
  const per100g=weight&&amount&&qty?Math.round((amount/qty/(weight/100))*100)/100:null;
  const obj={id:nextCostId++,date:document.getElementById('b-date').value,src,item:itemName,brand:brandName||'',qty,amount,weight:weight||null,unitPrice,per100g,note:brandName?`品牌：${brandName}`:note};
  if(!Array.isArray(DATA.costs))DATA.costs=[];
  DATA.costs.unshift(obj);
  let matched=DATA.items.find(i=>i.name===itemName);
  if(matched){matched.qty+=qty;}
  else{
    const defCat=DATA.cats.length?DATA.cats[0].name:'其他';
    matched={id:nextItemId++,name:itemName,cat:defCat,unit:'個',qty,min:1,reorder:null,sources:src?[src]:[],brands:[]};
    DATA.items.push(matched);
  }
  if(brandName){
    if(!Array.isArray(matched.brands))matched.brands=[];
    const ex=matched.brands.find(b=>b.name===brandName);
    if(ex){if(unitPrice!=null)ex.price=unitPrice;}
    else matched.brands.push({name:brandName,price:unitPrice,src,star:null,pros:'',cons:'',note:`${new Date().toLocaleDateString('zh-TW')} 自動新增`});
  }
  save();closeModal('buyModal');
  showToast(brandName?`已記錄，品牌「${brandName}」存入品牌筆記`:'已記錄並更新庫存');
  if(currentPage==='cost')renderCost();else if(currentPage==='inv')renderInv();else if(currentPage==='shop')renderShop();
}

function renderCost(c){
  if(!c)c=document.getElementById('mainContent');
  const all=toArr(DATA.costs);
  const filtered=all.filter(co=>{
    if(costRangeFrom&&co.date<costRangeFrom)return false;
    if(costRangeTo&&co.date>costRangeTo)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
  const total=filtered.reduce((a,b)=>a+(b.amount||0),0);
  const thisMonth=new Date().toISOString().slice(0,7);
  const monthTotal=filtered.filter(co=>co.date&&co.date.startsWith(thisMonth)).reduce((a,b)=>a+(b.amount||0),0);
  const byMonth={};
  filtered.forEach(co=>{const m=(co.date||'').slice(0,7);if(m){if(!byMonth[m])byMonth[m]=[];byMonth[m].push(co)}});
  c.innerHTML=`
    <div class="cost-summary">
      <div class="cost-range-row">
        <input type="date" id="cr-from" value="${costRangeFrom}" onchange="setCostRange()" placeholder="開始日期">
        <span class="cost-range-label">～</span>
        <input type="date" id="cr-to" value="${costRangeTo}" onchange="setCostRange()" placeholder="結束日期">
        ${costRangeFrom||costRangeTo?`<button class="btn sm" onclick="clearCostRange()" style="flex-shrink:0">清除</button>`:''}
      </div>
      <div class="cost-stats">
        <div class="cost-stat"><div class="cost-stat-label">${costRangeFrom||costRangeTo?'區間':'本月'}支出</div><div class="cost-stat-val">NT$ ${(costRangeFrom||costRangeTo?total:monthTotal).toLocaleString()}</div></div>
        <div class="cost-stat"><div class="cost-stat-label">累計支出</div><div class="cost-stat-val">NT$ ${total.toLocaleString()}</div></div>
      </div>
    </div>
    ${filtered.length===0?`<div class="empty"><i class="ti ti-receipt-off"></i>尚無採購記錄</div>`:''}
    ${Object.entries(byMonth).map(([m,list])=>`
      <div class="cost-month-header"><span>${m}</span><span>NT$ ${list.reduce((a,b)=>a+(b.amount||0),0).toLocaleString()}</span></div>
      ${list.map(co=>{
        return`<div class="cost-item">
          <div class="cost-date">${(co.date||'').slice(5)}</div>
          <div class="cost-info">
            <div class="cost-name">${co.item}${co.brand?` <span class="src-tag">${co.brand}</span>`:''} × ${co.qty}</div>
            <div class="cost-meta">${co.src||''}${co.note&&!co.note.startsWith('品牌：')?' · '+co.note:''}${co.per100g?' · 每百克 NT$'+(Number.isInteger(co.per100g)?co.per100g:co.per100g.toFixed(2)):''}</div>
          </div>
          <div class="cost-right">
            <div class="cost-amount">NT$ ${(co.amount||0).toLocaleString()}</div>
            ${co.unitPrice?`<div class="cost-unit-price">單價 NT$${co.unitPrice}</div>`:''}
          </div>
          <div class="cost-actions">
            <button class="btn icon sm" onclick="openCostEdit(${co.id})"><i class="ti ti-edit" style="font-size:14px"></i></button>
            <button class="btn icon sm danger-outline" onclick="delCost(${co.id})"><i class="ti ti-trash" style="font-size:14px"></i></button>
          </div>
        </div>`;
      }).join('')}`).join('')}`;
}

}
function delSettingItem(type,i){
  const name=type==='cat'?DATA.cats[i].name:DATA.sources[i];
  if(!confirm(`刪除「${name}」？`))return;
  if(type==='cat')DATA.cats.splice(i,1);else DATA.sources.splice(i,1);
  save();renderSettings();showToast('已刪除');
}
function addCat(){
  const n=document.getElementById('newCatName').value.trim();
  if(!n)return;
  if(DATA.cats.find(c=>c.name===n)){showToast('已存在');return}
  DATA.cats.push({name:n,color:document.getElementById('newCatColor').value});
  document.getElementById('newCatName').value='';
  save();renderSettings();showToast('已新增分類');
}
function addSrc(){
  const n=document.getElementById('newSrcName').value.trim();
  if(!n)return;
  if(DATA.sources.includes(n)){showToast('已存在');return}
  DATA.sources.push(n);
  document.getElementById('newSrcName').value='';
  save();renderSettings();showToast('已新增來源');
}

function initDragSort(listId,type){
  const list=document.getElementById(listId);
  if(!list)return;
  let dragging=null,startY=0,startScrollY=0;

  function getItemAtY(y){
    return [...list.querySelectorAll('.sortable-item')].find(el=>{
      const r=el.getBoundingClientRect();return y>=r.top&&y<=r.bottom;
    });
  }
  function commitOrder(){
    const items=[...list.querySelectorAll('.sortable-item')];
    const idxs=items.map(el=>parseInt(el.dataset.idx));
    if(type==='cat')DATA.cats=idxs.map(i=>DATA.cats[i]);
    else DATA.sources=idxs.map(i=>DATA.sources[i]);
    save();renderSettings();
  }

  list.querySelectorAll('.sortable-item').forEach(item=>{
    const handle=item.querySelector('.sortable-handle');
    if(!handle)return;

    item.setAttribute('draggable','true');
    item.addEventListener('dragstart',e=>{dragSrc=item;item.style.opacity='.4';e.dataTransfer.effectAllowed='move'});
    item.addEventListener('dragend',()=>{item.style.opacity='';commitOrder()});
    item.addEventListener('dragover',e=>{
      e.preventDefault();
      const r=item.getBoundingClientRect();
      list.insertBefore(dragSrc,e.clientY<r.top+r.height/2?item:item.nextSibling);
    });

    handle.addEventListener('touchstart',e=>{
      dragging=item;
      startY=e.touches[0].clientY;
      item.style.opacity='.5';
      item.style.boxShadow='0 4px 16px rgba(0,0,0,.15)';
      e.preventDefault();
    },{passive:false});
    handle.addEventListener('touchmove',e=>{
      if(!dragging)return;
      e.preventDefault();
      const y=e.touches[0].clientY;
      const target=getItemAtY(y);
      if(target&&target!==dragging){
        const r=target.getBoundingClientRect();
        list.insertBefore(dragging,y<r.top+r.height/2?target:target.nextSibling);
      }
    },{passive:false});
    handle.addEventListener('touchend',()=>{
      if(!dragging)return;
      dragging.style.opacity='';
      dragging.style.boxShadow='';
      dragging=null;
      commitOrder();
    });
  });
}

// ── Detail / Brand ────────────────────────────────────────────────────────
function openDetail(id){
  detailItemId=id;detailTab='brand';
  const item=DATA.items.find(i=>i.id===id);if(!item)return;
  document.getElementById('dt-title').textContent=item.name;
  switchDetailTab('brand');
  document.getElementById('detailModal').classList.add('open');
}
function switchDetailTab(tab){
  detailTab=tab;
  document.getElementById('dt-tab-brand').classList.toggle('active',tab==='brand');
  document.getElementById('dt-tab-history').classList.toggle('active',tab==='history');
  const btn=document.getElementById('dt-add-btn');
  const histBtn=document.getElementById('dt-record-btn');
  if(btn)btn.style.display=tab==='brand'?'':'none';
  if(histBtn)histBtn.style.display=tab==='history'?'':'none';
  if(tab==='brand')renderBrands();else renderPurchaseHistory();
}
function renderBrands(){
  const item=DATA.items.find(i=>i.id===detailItemId);
  const brands=item?toArr(item.brands):[];
  const el=document.getElementById('dt-body');
  if(!brands.length){el.innerHTML='<div class="empty" style="padding:2rem 0"><i class="ti ti-tag-off" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無品牌記錄<br><span style="font-size:13px;display:block;margin-top:4px">點上方「新增品牌」開始記錄</span></div>';return}
  el.innerHTML=brands.map((b,i)=>{
    const stars='★'.repeat(b.star||0)+'☆'.repeat(5-(b.star||0));
    const col=(b.star||0)>0?'#f59e0b':'#ccc';
    const bNameEsc=b.name.replace(/'/g,"\\'");
    return`<div class="brand-card">
      <div class="brand-header">
        <div><div class="brand-name">${b.name}</div><div class="brand-stars" style="color:${col}">${stars}</div></div>
        <div style="display:flex;gap:6px">
          <button class="btn primary sm" onclick="openBuyFromBrand('${bNameEsc}')"><i class="ti ti-cash"></i> 記帳</button>
          <button class="btn sm" onclick="openBrandForm(${i})"><i class="ti ti-edit"></i></button>
          <button class="btn sm danger-outline" onclick="delBrand(${i})"><i class="ti ti-trash"></i></button>
        </div>
      </div>
      <div class="brand-meta">${b.price?`<span>NT$ ${b.price}</span>`:''} ${b.src?`<span class="src-tag">${b.src}</span>`:''}</div>
      ${b.pros?`<div class="brand-pro"><span class="pro-con-label">✓ 優點</span>${b.pros}</div>`:''}
      ${b.cons?`<div class="brand-con"><span class="pro-con-label">✗ 缺點</span>${b.cons}</div>`:''}
      ${b.note&&!b.note.includes('自動新增')?`<div class="brand-note-text">備註：${b.note}</div>`:''}
    </div>`;
  }).join('');
}
function renderPurchaseHistory(){
  const item=DATA.items.find(i=>i.id===detailItemId);if(!item)return;
  const costs=toArr(DATA.costs).filter(c=>c.item===item.name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const el=document.getElementById('dt-body');
  if(!costs.length){el.innerHTML='<div class="empty" style="padding:2rem 0"><i class="ti ti-receipt-off" style="font-size:32px;display:block;margin-bottom:8px"></i>尚無購買記錄</div>';return}
  const total=costs.reduce((a,b)=>a+(b.amount||0),0);
  const totalQty=costs.reduce((a,b)=>a+(b.qty||0),0);
  const avgUnit=totalQty>0?Math.round(total/totalQty):null;
  el.innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <div style="flex:1;background:var(--surface2);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--text3);margin-bottom:3px">累計購買</div><div style="font-size:18px;font-weight:600">${totalQty} ${item.unit}</div></div>
      <div style="flex:1;background:var(--surface2);border-radius:var(--radius);padding:10px 12px"><div style="font-size:11px;color:var(--text3);margin-bottom:3px">平均單價</div><div style="font-size:18px;font-weight:600">${avgUnit!=null?'NT$ '+avgUnit:'—'}</div></div>
    </div>
    ${costs.map(co=>{
      const unit=co.qty>0&&co.amount>0?Math.round(co.amount/co.qty):null;
      return`<div class="purchase-row" style="align-items:center">
        <div class="purchase-date">${(co.date||'').replace(/^\d{4}-/,'')}</div>
        <div class="purchase-info">
          <div style="font-size:14px;font-weight:500">× ${co.qty} ${item.unit}${co.brand?` <span class="src-tag">${co.brand}</span>`:''}</div>
          <div style="font-size:12px;color:var(--text3)">${co.src||''}${co.per100g?' · 每百克 NT$'+(Number.isInteger(co.per100g)?co.per100g:co.per100g.toFixed(2)):''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="purchase-amount">NT$ ${(co.amount||0).toLocaleString()}</div>
          ${unit?`<div class="purchase-unit">單價 NT$${unit}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0;margin-left:4px">
          <button class="btn icon sm" onclick="openCostEditFromDetail(${co.id})" title="編輯"><i class="ti ti-edit" style="font-size:13px"></i></button>
          <button class="btn icon sm danger-outline" onclick="delCostFromDetail(${co.id})" title="刪除"><i class="ti ti-trash" style="font-size:13px"></i></button>
        </div>
      </div>`;
    }).join('')}`;
}
function delCostFromDetail(id){
  if(!confirm('確定刪除這筆記錄？'))return;
  DATA.costs=(DATA.costs||[]).filter(c=>c.id!==id);
  save();
  renderPurchaseHistory();
  showToast('已刪除');
}
function openCostEditFromDetail(id){
  // 記住目前在 detail modal，編輯完後刷新購買記錄
  openCostEdit(id);
  // 覆寫 saveCostEdit 完成後的行為：改成刷新購買記錄
  window._costEditFromDetail=true;
}
function openBrandForm(idx){
  editBrandIdx=(idx!==undefined)?idx:null;
  document.getElementById('br-src').innerHTML=['（未選擇）',...DATA.sources].map(s=>`<option>${s}</option>`).join('');
  if(editBrandIdx!==null){
    const item=DATA.items.find(i=>i.id===detailItemId);
    const b=toArr(item.brands)[editBrandIdx];
    document.getElementById('brandModalTitle').textContent='編輯品牌';
    document.getElementById('br-name').value=b.name||'';
    document.getElementById('br-price').value=b.price||'';
    document.getElementById('br-src').value=b.src||'（未選擇）';
    document.getElementById('br-pros').value=b.pros||'';
    document.getElementById('br-cons').value=b.cons||'';
    document.getElementById('br-note').value=b.note||'';
    setStar(b.star||0);
  } else {
    document.getElementById('brandModalTitle').textContent='新增品牌';
    ['br-name','br-pros','br-cons','br-note'].forEach(x=>document.getElementById(x).value='');
    document.getElementById('br-price').value='';setStar(0);
  }
  document.getElementById('brandModal').classList.add('open');
}
function setStar(n){
  starVal=n;
  const labels=['','很差','普通','還好','不錯','強力推薦'];
  document.querySelectorAll('#br-stars button').forEach((btn,i)=>{btn.textContent=i<n?'★':'☆';btn.style.color=i<n?'#f59e0b':'#ccc'});
  const lbl=document.getElementById('br-star-label');if(lbl)lbl.textContent=labels[n]||'';
}
function saveBrand(){
  const name=document.getElementById('br-name').value.trim();if(!name){alert('請填品牌名稱');return}
  const item=DATA.items.find(i=>i.id===detailItemId);if(!item)return;
  if(!Array.isArray(item.brands))item.brands=[];
  const src=document.getElementById('br-src').value;
  const obj={name,price:parseInt(document.getElementById('br-price').value)||null,src:src==='（未選擇）'?'':src,star:starVal||null,pros:document.getElementById('br-pros').value.trim(),cons:document.getElementById('br-cons').value.trim(),note:document.getElementById('br-note').value.trim()};
  if(editBrandIdx!==null)item.brands[editBrandIdx]=obj;else item.brands.push(obj);
  save();closeModal('brandModal');renderBrands();renderInv();showToast(editBrandIdx!==null?'已更新品牌':'已新增品牌');
}
function delBrand(idx){
  if(!confirm('確定刪除？'))return;
  const item=DATA.items.find(i=>i.id===detailItemId);if(!item)return;
  item.brands.splice(idx,1);save();renderBrands();renderInv();showToast('已刪除');
}
